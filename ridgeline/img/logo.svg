<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ridgeline">
  <defs>
    <linearGradient id="rl-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A78"/>
      <stop offset="1" stop-color="#0F8B8D"/>
    </linearGradient>
    <linearGradient id="rl-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F2EF"/>
    </linearGradient>
    <clipPath id="rl-clip"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#rl-clip)">
    <rect width="64" height="64" fill="url(#rl-sky)"/>
    <!-- far ridge -->
    <path d="M-2 46 L14 31 L22 37 L35 22 L50 35 L56 30 L66 40 L66 64 L-2 64 Z" fill="#FFFFFF" fill-opacity="0.28"/>
    <!-- near ridge -->
    <path d="M-2 54 L12 42 L20 47 L33 32 L44 42 L50 38 L66 50 L66 64 L-2 64 Z" fill="url(#rl-ridge)"/>
    <!-- trail to the summit -->
    <path d="M18 60 C 24 54, 28 52, 27 46 S 31 38, 33 33" fill="none" stroke="#0F8B8D" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 3.4"/>
    <!-- spark: the assistant -->
    <path d="M46 8 L48.1 14.4 L54.5 16.5 L48.1 18.6 L46 25 L43.9 18.6 L37.5 16.5 L43.9 14.4 Z" fill="#F7C548"/>
    <circle cx="54" cy="8.5" r="1.6" fill="#F7C548" fill-opacity="0.8"/>
  </g>
</svg>
